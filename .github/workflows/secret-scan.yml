name: Secret scan

# FCCV-92: this repo is public. Fail the build if a key, token, password or private key is committed.
# The scan prints path:line and the rule only — never the value. Zero dependencies (no npm install).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scanner self-test
        run: node --test scripts/secret-scan.test.js

      - name: Secret scan
        run: node scripts/secret-scan.js
